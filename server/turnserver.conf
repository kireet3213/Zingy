# This file is kept for manual coturn runs outside Docker.
# The Docker Compose service now passes equivalent flags directly on the command line.

# Run on the standard TURN/STUN port
listening-port=3478
no-tls
no-dtls

# For local dev, bind to all interfaces
listening-ip=0.0.0.0

# If you run coturn directly on the host, set this to your LAN IP.
external-ip=192.168.1.36

# Auth for WebRTC clients
lt-cred-mech
realm=local
user=devuser:devpass

# Keep relay ports in a small range
min-port=49160
max-port=49200

# Logging
verbose
fingerprint

# Local dev only
no-multicast-peers
no-cli
