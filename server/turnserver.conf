# TURN/STUN port
listening-port=3478
no-tls

# Bind to all interfaces
listening-ip=0.0.0.0

# Relay on the container IP, advertised as host LAN IP.
# external-ip is overridden by TURN_EXTERNAL_IP env var via docker-compose.
relay-ip=172.28.0.2
external-ip=192.168.1.36/172.28.0.2

# Auth for WebRTC clients
lt-cred-mech
realm=local
user=devuser:devpass

# Keep relay ports in a small range
min-port=49160
max-port=49200

# Logging
verbose
fingerprint

# Local dev only
no-multicast-peers
