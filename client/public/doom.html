<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>DOOM</title>
        <!-- Loaded in an isolated iframe: js-dos.css ships global resets that break the app's styles -->
        <link rel="stylesheet" href="/js-dos/js-dos.css" />
        <script src="/js-dos/js-dos.js"></script>
        <style>
            html,
            body,
            #dos {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div id="dos"></div>
        <script>
            // ?mode=host           -> start IPX server, report peerId to parent
            // ?mode=join&peer=<id> -> connect to host's IPX server
            // (no mode)            -> single player
            var params = new URLSearchParams(location.search);
            var mode = params.get('mode');
            var multiplayer = mode === 'host' || mode === 'join';

            var FALLBACK_ICE_SERVERS = [
                { urls: ['stun:stun.l.google.com:19302'] },
            ];

            function requestIceServers() {
                if (parent === window) {
                    return Promise.resolve(FALLBACK_ICE_SERVERS);
                }
                return new Promise(function (resolve) {
                    var timeout = setTimeout(function () {
                        window.removeEventListener('message', onMessage);
                        resolve(FALLBACK_ICE_SERVERS);
                    }, 3000);
                    function onMessage(event) {
                        if (event.source !== parent) return;
                        if (event.origin !== location.origin) return;
                        if (!event.data || event.data.type !== 'doom-ice-servers') return;
                        clearTimeout(timeout);
                        window.removeEventListener('message', onMessage);
                        resolve(event.data.iceServers);
                    }
                    window.addEventListener('message', onMessage);
                    parent.postMessage(
                        { type: 'doom-request-ice-servers' },
                        location.origin
                    );
                });
            }

            var options = {
                url: multiplayer
                    ? '/doom/doom-shareware-net.jsdos?v=2'
                    : '/doom/doom-shareware.jsdos',
                pathPrefix: '/js-dos/emulators/',
                autoStart: true,
                kiosk: true,
            };

            if (multiplayer) {
                options.backend = 'dosboxX';
                // Signaling defaults to the public https://net.dos.zone server.
                // ICE servers come from the parent app (same STUN/TURN as the video call).
                options.net = { iceServers: requestIceServers };
                if (mode === 'host') {
                    options.startIpxServer = true;
                } else {
                    options.connectIpxAddress = params.get('peer');
                }
            }

            Dos(document.getElementById('dos'), options);

            if (mode === 'host') {
                var poll = setInterval(function () {
                    var peerId = window.net && window.net.peerId;
                    if (peerId) {
                        clearInterval(poll);
                        parent.postMessage(
                            { type: 'doom-host-ready', peerId: String(peerId) },
                            location.origin
                        );
                    }
                }, 500);
            }
        </script>
    </body>
</html>
